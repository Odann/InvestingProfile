name: Update scores

on:
  # Times are UTC. This is 5:37 PM Toronto time in winter (6:37 PM in summer),
  # Monday to Friday, after the TSX closes at 4 PM. Yahoo has no credit limit,
  # but runs much more often than this can get the runner's address rate-limited.
  schedule:
    - cron: "37 22 * * 1-5"
  # Adds a "Run workflow" button on the Actions tab for an on-demand update
  workflow_dispatch:
  # Redeploy the page (without fetching data) when you edit the site
  push:
    branches: [main]
    paths: ["docs/index.html", "styles/**", "tailwind.config.js"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-scores
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: github.event_name != 'push'
        with:
          python-version: "3.12"
          cache: pip

      - name: Fetch from Yahoo Finance, score, grade past ratings
        if: github.event_name != 'push'
        run: |
          pip install -r requirements.txt
          python -m pipeline.update

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build the stylesheet
        run: npx --yes tailwindcss@3 -i styles/input.css -o docs/styles.css --minify

      - name: Save data to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update scores"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4
